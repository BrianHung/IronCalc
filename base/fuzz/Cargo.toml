[package]
name = "ironcalc_base-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"

[dependencies.ironcalc_base]
path = ".."
features = ["recalc_verify"]

[features]
default = ["recalc_verify"]
# Mirrors the base feature so the shared harness's cfg(feature = "recalc_verify")
# gates (evaluated against THIS crate) line up with the base crate's.
recalc_verify = ["ironcalc_base/recalc_verify"]

[[bin]]
name = "differential"
path = "fuzz_targets/differential.rs"
test = false
doc = false
bench = false

[[bin]]
name = "repro"
path = "src/bin/repro.rs"
test = false
doc = false
bench = false

[workspace]
members = ["."]
