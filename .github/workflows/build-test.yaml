name: Build and Test

on:
  push:
    branches: ["main"]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  lint-all:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "latest"
          cache: "npm"
          cache-dependency-path: |
            **/package-lock.json
      - name: Install node dependencies
        run: |
          curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
      - name: Lint
        run: make lint
  test-rust:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
      - name: Rust Tests
        run: make test-rust
      # Verify compares Incremental vs Full on Incremental passes only.
      # The snapshot is type + numeric bits + link + CF (not value text alone).
      # RAND/NOW/TODAY cones are stripped (they differ by design). Formula,
      # first-eval, and array/spill fallbacks are Full and are not compared.
      # A top-level INDIRECT is a 1×1 dynamic array (Full, skipped).
      # SUM/PRODUCT(INDIRECT) stay Incremental and are compared.
      - name: Incremental recalc check (Verify)
        run: IRONCALC_RECALC=verify cargo test -p ironcalc_base --features recalc_verify
      # ubuntu-latest is x86_64; macos-latest is arm64. Signed-zero and other
      # IEEE quirks are compared on both. The fuzzer is time-bounded.
      - name: Bounded incremental differential fuzz
        run: FUZZ_NO_MINIMIZE=1 FUZZ_AVOID_OPS=InsertRows,DeleteRows,InsertCols,DeleteCols,MoveRows,MoveCols,AddSheet,DeleteSheet,RenameSheet cargo test -p ironcalc_base --test fuzz_differential -- --nocapture
  test-js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "latest"
          cache: "npm"
          cache-dependency-path: |
            **/package-lock.json
      - name: Install node dependencies
        run: |
          curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
          npm install -g pnpm@9.15.4
      - name: JS Tests
        run: make test-js
  test-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
      - name: Python Tests
        run: make test-python
